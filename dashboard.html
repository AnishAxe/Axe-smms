<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AXE SMM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p class="loading-text">Loading...</p>
    </div>

    <div id="app">
        <!-- Header -->
        <header>
            <div class="brand">
                <img src="assets/logo.png" alt="AXE" class="logo" onerror="this.style.display='none'">
                <span class="brand-name">AXE SMM</span>
            </div>
            <div class="header-actions">
                <div class="balance-pill" onclick="window.location.href='add-funds.html'">
                    <i class="fas fa-wallet"></i>
                    <span>₹<span id="wallet-balance">0.00</span></span>
                </div>
                <div class="menu-toggle" id="menuToggle">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <a href="dashboard.html" class="active"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="services.html"><i class="fas fa-th-large"></i> Services</a>
            <a href="add-funds.html"><i class="fas fa-plus-circle" style="color: var(--success-green);"></i> Add Funds</a>
            <a href="history.html"><i class="fas fa-clock"></i> History</a>
            <a href="refer.html"><i class="fas fa-gift" style="color: var(--gold);"></i> Refer & Earn</a>
            <a href="#" id="logout-btn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>

        <div class="overlay" id="overlay"></div>

        <!-- Main Content -->
        <main>
            <h2 class="section-title"><i class="fas fa-chart-pie"></i> Dashboard</h2>
            
            <!-- Quick Actions -->
            <div class="quick-actions">
                <a href="services.html" class="quick-action-btn">
                    <span class="icon">🛒</span>
                    <span class="label">Order Now</span>
                </a>
                <a href="add-funds.html" class="quick-action-btn">
                    <span class="icon">💰</span>
                    <span class="label">Add Funds</span>
                </a>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="icon"><i class="fas fa-shopping-bag"></i></div>
                    <div class="number" id="stat-orders">0</div>
                    <div class="label">Total Orders</div>
                </div>
                <div class="stat-card">
                    <div class="icon"><i class="fas fa-coins" style="color: var(--gold);"></i></div>
                    <div class="number" id="stat-spent">0</div>
                    <div class="label">Total Spent</div>
                </div>
                <div class="stat-card">
                    <div class="icon"><i class="fas fa-wallet" style="color: var(--success-green);"></i></div>
                    <div class="number" id="stat-balance">0</div>
                    <div class="label">Wallet Balance</div>
                </div>
                <div class="stat-card">
                    <div class="icon"><i class="fas fa-users" style="color: var(--accent-cyan);"></i></div>
                    <div class="number" id="stat-referrals">0</div>
                    <div class="label">Referrals</div>
                </div>
            </div>
        </main>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, onAuthStateChanged, signOut } from "firebase/auth";
        import { getFirestore, doc, onSnapshot, query, collection, where } from "firebase/firestore";

        const firebaseConfig = { 
            apiKey: "AIzaSyDb_CJqakTJEVA52IYwz76egyVuINOXTmw", 
            authDomain: "anish-285df.firebaseapp.com", 
            projectId: "anish-285df", 
            storageBucket: "anish-285df.firebasestorage.app", 
            messagingSenderId: "40699037801", 
            appId: "1:40699037801:web:06c80740ddcd85555abaf8" 
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const setLoading = (show) => {
            document.getElementById('loading-screen').style.display = show ? 'flex' : 'none';
        };

        // Menu Toggle
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            this.classList.toggle('active');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            menuToggle.classList.remove('active');
        });

        document.querySelectorAll('.sidebar a').forEach(link => {
            link.addEventListener('click', () => {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
                menuToggle.classList.remove('active');
            });
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'index.html';
        });

        // Load Dashboard Data
        function loadDashboard(userId) {
            setLoading(true);

            // User data
            onSnapshot(doc(db, "users", userId), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById('wallet-balance').innerText = (data.points || 0).toFixed(2);
                    document.getElementById('stat-balance').innerText = (data.points || 0).toFixed(2);
                    document.getElementById('stat-referrals').innerText = data.referrals || 0;
                }
            });

            // User's orders
            const ordersQuery = query(collection(db, "orders"), where("userId", "==", userId));
            onSnapshot(ordersQuery, (snap) => {
                let spent = 0;
                snap.forEach(doc => {
                    spent += (doc.data().amount || 0);
                });
                document.getElementById('stat-orders').innerText = snap.size;
                document.getElementById('stat-spent').innerText = spent.toFixed(1);
            });

            setTimeout(() => setLoading(false), 500);
        }

        // Auth Check
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadDashboard(user.uid);
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
